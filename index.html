<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <meta name="description" content="A thoughtful design studio for websites, digital products and visual identities. Tell us about your next project." />
    <title>Forma Studio — Design that moves you forward</title>
  </head>
  <body>
    <!-- Netlify uses this static form markup to detect the form at deploy time. -->
    <form name="client-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="client-enquiry" />
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" />
      <input name="phone" />
      <input name="company" />
      <input name="service" />
      <input name="budget" />
      <input name="timeline" />
      <input name="projectDetails" />
      <input name="referenceUrl" />
      <input name="consent" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
